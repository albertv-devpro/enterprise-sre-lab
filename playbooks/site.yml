---
- name: Enterprise Baseline Configuration
  hosts: all
  become: true
  gather_facts: true
  tags: [baseline]

  tasks:
    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Update DNF package cache (Rocky)
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Install essential SRE and troubleshooting tools
      ansible.builtin.package:
        name:
          - curl
          - git
          - htop
          - unzip
          - vim
        state: present

- name: Configure Node Exporter on all nodes
  hosts: all
  become: true
  tags: [node_exporter]
  roles:
    - monitoring

- name: Configure the web server
  hosts: webservers
  become: true
  tags: [webserver]
  roles:
    - webserver

- name: Deploy the observability stack
  hosts: monitoring
  become: true
  tags: [observability]
  roles:
    - observability

- name: Deploy Loki log storage
  hosts: monitoring
  become: true
  tags: [logging]
  roles:
    - loki

- name: Configure Alloy log collectors
  hosts: all
  become: true
  tags: [logging]
  roles:
    - logging
