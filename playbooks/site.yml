---
- name: Enterprise Baseline Configuration
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Update DNF package cache (Rocky)
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Install essential SRE and troubleshooting tools
      ansible.builtin.package:
        name:
          - curl
          - git
          - htop
          - unzip
          - vim
        state: present

