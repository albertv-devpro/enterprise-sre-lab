---
- name: Install Node Exporter on Debian-family hosts
  ansible.builtin.package:
    name: prometheus-node-exporter
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Node Exporter on Red Hat-family hosts
  ansible.builtin.package:
    name: node-exporter
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Ensure the Debian Node Exporter service is enabled and running
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure the Red Hat Node Exporter service is enabled and running
  ansible.builtin.service:
    name: node_exporter
    state: started
    enabled: true
  when: ansible_facts['os_family'] == 'RedHat'
