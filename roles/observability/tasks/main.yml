---
- name: Verify observability role host platform
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: The observability role currently supports Debian-family hosts.

- name: Install Grafana repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download Grafana repository signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: '0644'

- name: Configure Grafana APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    filename: grafana
    state: present
    update_cache: true

- name: Install Prometheus and Grafana
  ansible.builtin.apt:
    name:
      - prometheus
      - grafana
    state: present

- name: Deploy Prometheus scrape configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: prometheus
    mode: '0644'
    validate: /usr/bin/promtool check config %s
  notify: Restart Prometheus

- name: Ensure Prometheus is enabled and running
  ansible.builtin.service:
    name: prometheus
    state: started
    enabled: true

- name: Ensure Grafana is enabled and running
  ansible.builtin.service:
    name: grafana-server
    state: started
    enabled: true
