---
- name: Verify observability role host platform
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: The observability role currently supports Debian-family hosts.

- name: Check that the Alertmanager webhook token exists on the controller
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/enterprise-sre-automation/api-token"
  delegate_to: localhost
  become: false
  register: observability_api_token

- name: Check that the local development CA certificate exists on the controller
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/enterprise-sre-automation/tls/lab-ca.crt"
  delegate_to: localhost
  become: false
  register: observability_api_ca

- name: Require an Alertmanager webhook token
  ansible.builtin.assert:
    that:
      - observability_api_token.stat.exists
      - observability_api_token.stat.isreg
      - observability_api_ca.stat.exists
      - observability_api_ca.stat.isreg
    fail_msg: Create the API token and development CA certificate using automation-api/generate-dev-certs.sh before deploying observability.

- name: Install Grafana repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download Grafana repository signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: '0644'

- name: Configure Grafana APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    filename: grafana
    state: present
    update_cache: true

- name: Install Prometheus and Grafana
  ansible.builtin.apt:
    name:
      - prometheus
      - grafana
      - prometheus-alertmanager
    state: present

- name: Create Prometheus rules directory
  ansible.builtin.file:
    path: /etc/prometheus/rules
    state: directory
    owner: root
    group: prometheus
    mode: '0755'

- name: Deploy Prometheus alert rules
  ansible.builtin.template:
    src: node-alerts.yml.j2
    dest: /etc/prometheus/rules/node-alerts.yml
    owner: root
    group: prometheus
    mode: '0644'
    validate: /usr/bin/promtool check rules %s
  notify: Restart Prometheus

- name: Deploy Prometheus scrape configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: prometheus
    mode: '0644'
    validate: /usr/bin/promtool check config %s
  notify: Restart Prometheus

- name: Create Alertmanager secrets directory
  ansible.builtin.file:
    path: /etc/alertmanager
    state: directory
    owner: root
    group: prometheus
    mode: '0750'

- name: Install API development CA for Alertmanager
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/enterprise-sre-automation/tls/lab-ca.crt"
    dest: /etc/alertmanager/api-ca.crt
    owner: root
    group: prometheus
    mode: '0644'
  notify: Restart Alertmanager

- name: Install Alertmanager webhook token
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') + '/.config/enterprise-sre-automation/api-token') | trim }}\n"
    dest: /etc/alertmanager/api-token
    owner: root
    group: prometheus
    mode: '0640'
  no_log: true
  notify: Restart Alertmanager

- name: Deploy Alertmanager webhook configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /etc/prometheus/alertmanager.yml
    owner: root
    group: prometheus
    mode: '0640'
    validate: /usr/bin/amtool check-config %s
  notify: Restart Alertmanager

- name: Ensure Prometheus is enabled and running
  ansible.builtin.service:
    name: prometheus
    state: started
    enabled: true

- name: Ensure Alertmanager is enabled and running
  ansible.builtin.service:
    name: prometheus-alertmanager
    state: started
    enabled: true

- name: Ensure Grafana is enabled and running
  ansible.builtin.service:
    name: grafana-server
    state: started
    enabled: true

- name: Create Grafana provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: '0755'
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /var/lib/grafana/dashboards/enterprise-sre-lab

- name: Provision Prometheus as Grafana's default data source
  ansible.builtin.template:
    src: grafana-prometheus-datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: '0640'
  notify: Restart Grafana

- name: Provision Enterprise SRE Lab dashboard provider
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: /etc/grafana/provisioning/dashboards/enterprise-sre-lab.yml
    owner: root
    group: grafana
    mode: '0640'
  notify: Restart Grafana

- name: Provision Enterprise SRE Lab fleet dashboard
  ansible.builtin.copy:
    src: enterprise-sre-lab-dashboard.json
    dest: /var/lib/grafana/dashboards/enterprise-sre-lab/fleet-overview.json
    owner: grafana
    group: grafana
    mode: '0644'
  notify: Restart Grafana

- name: Disable anonymous Grafana access
  ansible.builtin.ini_file:
    path: /etc/grafana/grafana.ini
    section: auth.anonymous
    option: enabled
    value: 'false'
    no_extra_spaces: true
  notify: Restart Grafana

- name: Prevent Grafana viewers from editing dashboards
  ansible.builtin.ini_file:
    path: /etc/grafana/grafana.ini
    section: users
    option: viewers_can_edit
    value: 'false'
    no_extra_spaces: true
  notify: Restart Grafana
